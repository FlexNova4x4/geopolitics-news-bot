name: Geopolitics News Bot

on:
  schedule:
    # Start every 6 hours, outside the top of the hour to reduce GitHub schedule congestion.
    # Each job runs for 5h50m, leaving a 10-minute gap before the next scheduled session.
    - cron: "13 0,6,12,18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: geopolitics-news-bot
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Checkout public source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Run the 5h50m service window
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.5-flash-lite' }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL || 'qwen/qwen3.8-27b' }}
          WEBSITE_RSS_URLS: ${{ vars.WEBSITE_RSS_URLS || 'https://www.mea.gov.in/press-releases.htm?dtl/rss,https://thediplomat.com/regions/south-asia/feed/,https://thediplomat.com/category/asia-geopolitics/feed/,https://thediplomat.com/category/asia-defense/feed/,https://defence.economictimes.indiatimes.com/rss/topstories,https://defence.economictimes.indiatimes.com/rss/policy-partnerships,https://defence.economictimes.indiatimes.com/rss/military-systems,https://defence.economictimes.indiatimes.com/rss/research-security,https://www.livefistdefence.com/feed/,https://www.indiandefensenews.in/feeds/posts/default?alt=rss,https://api.thehawk.in/rss/international-relations/india-china' }}
          YOUTUBE_CHANNEL_ID: ''
          CYCLE_MINUTES: "30"
          SERVICE_MINUTES: "350"
          AI_BATCH_SIZE: "4"
          MAX_ITEM_AGE_HOURS: "36"
          NEWS_TIMEZONE: "Asia/Kolkata"
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATE_BRANCH: bot-state
        run: python -u main.py --duration-minutes 350 --interval-minutes 30
